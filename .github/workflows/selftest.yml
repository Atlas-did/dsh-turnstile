name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Fixtures must always pass. Environment cases skip here because no DSH install exists,
      # so --allow-skips keeps the run meaningful instead of silently green.
      - name: scanners still catch their fixtures
        run: node tools/selftest.mjs --allow-skips
      # The crowding check must go red on 11 plugins, or the threshold logic regressed.
      - name: ui fixture must trip the threshold
        run: |
          set +e
          node tools/ui-surfaces.mjs tests/ui-fixture/profiles/ui
          code=$?
          set -e
          if [ $code -ne 11 ]; then echo "expected exit 11, got $code"; exit 1; fi
      # A commented-out bad import must stay green: this is the AST-vs-regex guarantee.
      - name: ast fixture must not report commented imports
        run: node tools/risk.mjs tests/ast-fixture
      # The 2026-10-31 frozen corpus must keep producing the same verdicts.
      # If this goes red, either the code regressed or the corpus was tampered with (drift check).
      - name: diagnose acceptance (A/B/C/D/E against the frozen corpus)
        run: node tools/test-diagnose.mjs
      - name: records layer counts
        run: node tools/test-records.mjs
      - name: trap regressions (duplicate market, git deps, client bundle parse)
        run: node tools/test-pits.mjs
      - name: preinstall gate
        run: node tools/test-preinstall.mjs
      - name: NO_PROXY effectiveness
        run: node tools/test-proxy.mjs

      # 2026-11-01 新增：入口转发、UI 面扫描口径、semver 漂移、卡片硬规则
      - name: entry + ui-scan + card
        run: |
          node tools/test-turnstile-entry.mjs
          node plugins/turnstile-popup/test/ui-scan.test.mjs
          node tools/test-recommend-card.mjs

      # 这里以前用 `|| true` 吞掉了真实失败（handoff P0-4）。现在显式声明运行时版本，真的跑。
      - name: semver drift + slot-map + snapshots
        run: |
          DSH_VERSION=0.2.1-rc.3 node plugins/turnstile-popup/test/semver-drift.test.mjs
          node tools/test-slot-map-report.mjs
          node tools/test-profile-snapshot.mjs

      # 契约层与证据层：这些人话/next/agentPrompt/六级判定是给智能体读的，不能只在本机跑。
      - name: contract + evidence + run route
        run: |
          node tools/test-report-contract.mjs
          node tools/test-evidence.mjs
          node tools/test-verify-live.mjs
          node tools/test-trial-wiring.mjs
          node plugins/turnstile-popup/test/run-route.test.mjs

      # 发布一致性：文档链接、命令注册表、npm 包内容
      - name: release check
        run: node tools/release-check.mjs --pack --json

      # 完整回归：CI 不能只跑零散步骤（复审 P1-6）。这一步失败就说明本地绿是假象。
      - name: full test suite
        run: npm run test:all --silent

      # 测试不许改写仓库：以前 docs-smoke 会在根目录写出一个名为 `#` 的文件
      - name: tests must not modify the worktree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo '测试改动了工作区：'; git status --porcelain; git diff --stat; exit 1;
          fi

  # 离线浏览器套件单列：它们需要 Chromium，装起来比 gate 慢，但不能因此不跑。
  # 2026-11-03：panel 套件曾在本地红了三轮没人发现，就是因为只在需要时才有人手动跑它。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: install chromium for playwright-core
        run: npx --yes playwright install --with-deps chromium
      - name: offline console suites
        run: |
          node tools/e2e-console-offline.mjs
          node tools/e2e-designer-offline.mjs
          node tools/e2e-annotations-offline.mjs
          node tools/e2e-panel-offline.mjs
      - name: worktree must stay clean after browser suites
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo 'browser suites dirtied the worktree:'; git status --porcelain; exit 1; fi
