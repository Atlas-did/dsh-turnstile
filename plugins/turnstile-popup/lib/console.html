<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnstile 控制台</title>
<style>
:root{color-scheme:dark;--bg:#0b1016;--nav:#0f161e;--panel:#121b24;--raised:#182531;--line:#283744;--text:#e5edf4;--muted:#8e9eac;--blue:#72b7ff;--green:#56d28c;--red:#ff8279;--amber:#e6b85c;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
.steward-grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:14px;align-items:start}@media(max-width:1100px){.steward-grid{grid-template-columns:1fr}}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{color:inherit}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) 28px}.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0d141c}.brand{font-weight:700;font-size:15px;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.08em}.search-wrap{position:relative;flex:1;max-width:660px;margin:auto}.search{width:100%;height:35px;border:1px solid var(--line);border-radius:8px;background:#0a1118;color:var(--text);padding:0 34px 0 32px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 2px #72b7ff18}.search-icon{position:absolute;left:11px;top:7px;color:var(--muted)}.top-actions{display:flex;gap:6px}.btn,.icon-btn{border:1px solid var(--line);background:var(--raised);border-radius:7px;min-height:32px;padding:5px 10px;cursor:pointer}.btn:hover,.icon-btn:hover{border-color:#486175;background:#1d2d3b}.btn:disabled{opacity:.4;cursor:not-allowed}.icon-btn{width:34px;padding:4px}.workspace{min-height:0;display:grid;grid-template-columns:196px minmax(420px,1fr) 300px}.sidebar{background:var(--nav);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px}.nav-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;padding:0 10px 8px}.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--muted)}.nav-btn:hover{background:#16212b;color:var(--text)}.nav-btn.active{background:#1a2a38;border-color:#31506a;color:var(--blue)}.nav-btn .count{margin-left:auto;font:11px var(--mono);color:var(--muted)}.side-note{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;color:var(--muted);font-size:11px}.main{min-width:0;min-height:0;overflow:auto;padding:22px 24px 50px}.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}.page-head h1{font-size:20px;line-height:1.3;margin:0}.page-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.page-actions{margin-left:auto;display:flex;gap:6px}.inspector{min-height:0;overflow:auto;background:var(--nav);border-left:1px solid var(--line);padding:18px 16px}.inspector h2{font-size:13px;margin:0}.inspector-empty{color:var(--muted);margin-top:14px}.tabs{display:flex;border-bottom:1px solid var(--line);margin:16px 0 12px}.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:7px 12px;cursor:pointer}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.prop-group{margin:12px 0}.prop-title{color:var(--muted);font-size:10px;letter-spacing:.08em;margin-bottom:5px}.prop{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid #ffffff08}.prop dt{color:var(--muted)}.prop dd{margin:0;word-break:break-word;font-family:var(--mono);font-size:11px}.action-stack{display:grid;gap:8px}.action-stack .btn{text-align:left}.statusbar{display:flex;align-items:center;gap:18px;border-top:1px solid var(--line);padding:0 14px;color:var(--muted);font-size:11px;background:#0d141c}.statusbar .spacer{flex:1}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px}.hero{border:1px solid var(--line);border-radius:12px;padding:18px;background:linear-gradient(135deg,#162431,#111a23);margin-bottom:14px}.hero-line{display:flex;align-items:center;gap:12px}.verdict{font-size:22px;font-weight:700}.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}.verdict.unknown{color:var(--amber)}.hero p{color:var(--muted);margin:6px 0 0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.metric{border:1px solid var(--line);background:var(--panel);border-radius:10px;text-align:left;padding:14px;cursor:pointer}.metric:hover{border-color:var(--blue);transform:translateY(-1px)}.metric strong{display:block;font:24px var(--mono)}.metric span{color:var(--muted);font-size:11px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:14px;overflow:hidden}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.panel-head h2{font-size:13px;margin:0}.panel-body{padding:14px}.hint{color:var(--muted);font-size:12px}.empty{padding:30px 14px;text-align:center;color:var(--muted)}.data-table{width:100%;border-collapse:collapse}.data-table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;border-bottom:1px solid var(--line)}.data-table td{padding:10px 12px;border-bottom:1px solid #ffffff08;vertical-align:top}.data-table tbody tr{cursor:pointer}.data-table tbody tr:hover,.data-table tbody tr.selected{background:#72b7ff0b}.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.num{text-align:right;font-family:var(--mono)}.chip{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:10px;white-space:nowrap;color:var(--muted)}.chip.good{color:var(--green);border-color:#56d28c55}.chip.bad{color:var(--red);border-color:#ff827955}.chip.warn{color:var(--amber);border-color:#e6b85c55}.chip.blue{color:var(--blue);border-color:#72b7ff55}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:0 8px}.finding{border-left:2px solid var(--red);padding:8px 10px;margin:7px 0;background:#ff827908}.finding pre{white-space:pre-wrap;word-break:break-word;color:var(--blue);font:11px var(--mono)}.breadcrumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:14px}.crumb{border:0;background:none;color:var(--blue);padding:3px 5px;cursor:pointer}.crumb.current{color:var(--text);font-weight:600}.crumb-sep{color:var(--muted)}.arch-stage{border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 0,#182b3a55,transparent 55%),var(--panel);padding:18px;min-height:390px}.arch-current{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}.arch-current strong{font:16px var(--mono)}.arch-children{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:16px}.arch-node{border:1px solid var(--line);background:#101922;border-radius:9px;text-align:left;padding:13px;cursor:pointer;min-height:96px;position:relative}.arch-node:hover{border-color:var(--blue);background:#152431}.arch-node .kind{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.arch-node strong{display:block;font:12px var(--mono);margin:7px 0;word-break:break-word}.arch-node small{color:var(--muted)}.arch-node .enter{position:absolute;right:10px;bottom:9px;color:var(--blue)}.depth{font:11px var(--mono);color:var(--muted)}.source-link{display:inline-block;color:var(--blue);text-decoration:none;border:1px solid #72b7ff55;border-radius:7px;padding:8px 10px;margin-top:10px;word-break:break-all}.source-link:hover{background:#72b7ff10}.notice{padding:9px 12px;border:1px solid var(--amber);border-radius:8px;color:var(--amber);margin-bottom:12px;background:#e6b85c0a}.focus .workspace{grid-template-columns:0 minmax(0,1fr) 0}.focus .sidebar,.focus .inspector{display:none}.focus .main{padding-left:max(24px,calc((100vw - 1200px)/2));padding-right:max(24px,calc((100vw - 1200px)/2))}
.delta-strip{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;margin-bottom:12px;background:#72b7ff08;color:var(--muted)}tr.delta-added{background:#39c5cf16}tr.delta-toggled{background:#e6b85c14}tr.delta-moved{background:#72b7ff12}.delta-removed{color:var(--red)}.th-sort{border:0;background:none;color:inherit;padding:0;cursor:pointer;text-transform:inherit;font:inherit;letter-spacing:inherit}.th-sort:hover{color:var(--blue)}.danger{border-color:var(--red);color:var(--red)}.context-menu{position:fixed;z-index:30;width:190px;padding:5px;background:var(--raised);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 35px #0008}.context-menu .btn{display:block;width:100%;text-align:left;border:0;background:none}.context-menu .btn:hover{background:#72b7ff12}.patch-dialog{position:fixed;inset:0;z-index:40;background:#05090dc9;display:grid;place-items:center;padding:24px}.patch-card{width:min(1000px,96vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.patch-card h2{margin:0 0 5px}.patch-diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.patch-diff pre{overflow:auto;max-height:52vh;background:#0a1118;border:1px solid var(--line);border-radius:8px;padding:12px;font:11px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}.patch-actions{display:flex;justify-content:flex-end;gap:8px}.hide-inspector .workspace{grid-template-columns:196px minmax(0,1fr) 0}.hide-inspector .inspector{display:none}.focus.hide-inspector .workspace{grid-template-columns:0 minmax(0,1fr) 0}
@media(max-width:1000px){.workspace{grid-template-columns:164px minmax(360px,1fr)}.inspector{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.brand small{display:none}}
@media(max-width:680px){.workspace{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 10px;gap:8px}.brand{display:none}.main{padding:14px}.arch-children{grid-template-columns:1fr}.metrics{gap:7px}.metric{padding:10px}.focus .main{padding:14px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">TURNSTILE<small>PLUGIN CONTROL</small></div>
  <div class="search-wrap"><span class="search-icon">⌕</span><input id="global-search" data-testid="global-search" class="search" type="search" placeholder="即时筛选：插件、检查、UI 面、架构节点…" aria-label="全局筛选"></div>
  <div class="top-actions"><button id="export" data-testid="export-filtered" class="btn" type="button" title="导出当前筛选结果 CSV">导出</button><button id="refresh" data-testid="console-refresh" class="btn" type="button" title="重采样并比较变化 (F5)">↻ 刷新</button><button id="toggle-plugin" data-testid="toggle-plugin" class="btn danger" type="button" disabled>停用插件</button><button id="details" data-testid="details-toggle" class="icon-btn" type="button" title="显示/隐藏属性面板 (Ctrl+L)" aria-label="显示或隐藏属性面板">▤</button><button id="focus" data-testid="focus-mode" class="icon-btn" type="button" title="切换专注模式" aria-label="切换专注模式">⛶</button></div>
</header>
<div class="workspace">
<nav class="sidebar" aria-label="控制台导航"><div class="nav-label">工作区</div><div id="nav"></div><div class="side-note">清单声明 ≠ 运行态<br>缺少数据时明确显示，不猜测。</div></nav>
<main id="main" class="main" tabindex="-1"></main>
<aside id="inspector" class="inspector"></aside>
</div>
<footer class="statusbar"><span><i class="dot"></i><span id="connection">正在读取</span></span><span id="counts">0 / 0</span><span class="spacer"></span><span id="generated"></span></footer>
</div>
<script src="/turnstile/sort-context.js"></script>
<script src="/turnstile/capabilities.js"></script>
<script src="/turnstile/selection.js"></script>
<script src="/turnstile/history-timeline.js"></script>
<script src="/turnstile/field-schema.js"></script>
<script src="/turnstile/hooks.js"></script>
<script src="/turnstile/hook-rules.js"></script>
<script src="/turnstile/virtual-window.js"></script>
<script src="/turnstile/inspector-model.js"></script>
<script src="/turnstile/diff-state.js"></script>
<script>
'use strict';
const $=(id)=>document.getElementById(id);
const state={data:null,view:'overview',query:'',selected:null,inspectorTab:'properties',archId:'profile',pluginStatus:'all',busy:false,focus:false,hideInspector:false,delta:null,sort:{key:'name',dir:1},context:null,patchPreview:null,notice:''};
const views=[['steward','环境管家','◎'],['overview','总览','⌂'],['designer','配置设计器','▧'],['checks','门禁检查','✓'],['plugins','插件','▤'],['surfaces','UI 占用','▦'],['architecture','深层架构','⌘'],['history','历史','◷']];
function node(tag,props={},children=[]){const n=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined)n.setAttribute(k,v);}for(const c of children){if(c===null||c===undefined)continue;n.append(c.nodeType?c:document.createTextNode(String(c)));}return n;}
function btn(text,onClick,testid,cls='btn'){return node('button',{type:'button',class:cls,text,'data-testid':testid,onclick:onClick});}
function chip(text,kind=''){return node('span',{class:'chip '+kind,text});}
function matches(value){return !state.query||JSON.stringify(value).toLowerCase().includes(state.query.toLowerCase());}
function apiUrl(){return location.pathname.indexOf('/turnstile/console')===0?'/turnstile/console-data':'/api/console';}
function tokenSuffix(){const t=new URLSearchParams(location.search).get('token');return t?'?token='+encodeURIComponent(t):'';}
function snapshotOf(d){const out={};const positions={};(d.occupancy?.surfaces||[]).forEach(s=>Object.entries(s.anchors||{}).forEach(([name,anchor])=>{if(anchor)positions[name]=anchor;}));d.plugins.forEach(p=>{out[p.name]={state:p.missing?'missing':p.disabled?'off':'on',position:positions[p.name]||''};});return out;}
function deltaOf(current,previous){const delta={firstRun:!previous,at:previous?.at||null,added:[],removed:[],toggled:[],moved:[]};if(!previous?.rows)return delta;for(const [name,row] of Object.entries(current)){const old=previous.rows[name];if(!old)delta.added.push(name);else{if(old.state!==row.state)delta.toggled.push({name,from:old.state,to:row.state});if(old.position!==row.position)delta.moved.push({name,from:old.position||'未设置',to:row.position||'未设置'});}}for(const name of Object.keys(previous.rows))if(!current[name])delta.removed.push(name);return delta;}
function selectionForPlugin(p){return{title:p.name,kind:'plugin',plugin:p,properties:{名称:p.name,版本:p.version||'未安装',状态:p.missing?'未安装':p.disabled?'已停用':'配置启用',行ID:p.rows.join(', ')||'无',UI面:p.ui.join(', ')||'无',引擎范围:p.engineRange||'未声明'},source:{file:p.manifest,line:1},archId:p.architectureId};}
async function load(){state.busy=true;renderTop();try{const r=await fetch(apiUrl()+tokenSuffix(),{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);const next=await r.json();const key='turnstile.console.seen.'+next.profile.name;let previous=null;try{previous=JSON.parse(localStorage.getItem(key)||'null');}catch{}const rows=snapshotOf(next);state.delta=deltaOf(rows,previous);try{localStorage.setItem(key,JSON.stringify({at:new Date().toISOString(),rows}));}catch{}state.data=next;if(!next.architecture.nodes.some(n=>n.id===state.archId))state.archId=next.architecture.rootId;if(state.selected?.kind==='plugin'){const p=next.plugins.find(x=>x.name===state.selected.title);state.selected=p?selectionForPlugin(p):null;}else if(state.selected?.archId){const n=next.architecture.nodes.find(x=>x.id===state.selected.archId);state.selected=n?selectionForNode(n):null;}$('connection').textContent='数据已读取';}catch(e){$('connection').textContent='读取失败';state.notice=String(e.message||e);}finally{state.busy=false;render();}}
async function toggleRequest(plugin,dryRun){const r=await fetch('/turnstile/toggle'+tokenSuffix(),{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({package:plugin.name,disable:!plugin.disabled,dryRun})});const d=await r.json();if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d;}
async function previewToggle(plugin){if(!plugin||plugin.missing||!plugin.row)return;state.busy=true;state.context=null;renderTop();try{const result=await toggleRequest(plugin,true);state.patchPreview={plugin,disable:!plugin.disabled,before:result.before,after:result.after};}catch(e){state.notice='生成 patch 预览失败：'+e.message;}finally{state.busy=false;render();}}
async function applyToggle(){const preview=state.patchPreview;if(!preview)return;state.busy=true;try{await toggleRequest(preview.plugin,false);state.notice=(preview.disable?'已停用 ':'已启用 ')+preview.plugin.name+'；已留备份，重启 mini 后生效。';state.patchPreview=null;await load();}catch(e){state.notice='应用失败：'+e.message;}finally{state.busy=false;render();}}
function persistView(){try{clearTimeout(window.__viewTimer);window.__viewTimer=setTimeout(()=>{fetch('/turnstile/view-state'+tokenSuffix(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({view:state.view,query:state.query,status:state.pluginStatus,sortKey:state.sort.key,sortDir:state.sort.dir})}).catch(()=>{});},400);}catch(e){}}
async function restoreView(){try{const r=await fetch('/turnstile/view-state'+tokenSuffix());if(!r.ok)return;const j=await r.json();const s=j&&j.state;if(!s)return;state.view=s.view||state.view;state.query=s.query||'';state.pluginStatus=s.status||state.pluginStatus;state.sort={key:s.sortKey||state.sort.key,dir:s.sortDir||state.sort.dir};const box=$('global-search');if(box)box.value=state.query;}catch(e){}}
function setView(view){state.view=view;state.query='';$('global-search').value='';persistView();render();}
function selectionForNode(n){return{title:n.label,kind:n.kind,properties:n.properties,source:n.source,archId:n.id};}
function selectionText(){const S=window.TurnstileSelection;const pick=state.picked||{ids:[]};if(!S||pick.ids.length<2)return '';return S.describe(pick,state.data.plugins);}
function pickPlugin(p,ev){const S=window.TurnstileSelection;if(!S)return;const order=state.data.plugins.map(x=>x.name);state.picked=S.select(state.picked||S.EMPTY,p.name,{ctrl:Boolean(ev&&(ev.ctrlKey||ev.metaKey)),shift:Boolean(ev&&ev.shiftKey),order});const el=document.querySelector('[data-testid="selection-summary"]');if(el)el.textContent=selectionText();}
function select(item){state.selected=item;state.inspectorTab='properties';state.context=null;renderTop();renderInspector();document.querySelectorAll('tr.selected').forEach(x=>x.classList.remove('selected'));}
function locate(id){if(!id)return;state.archId=id;state.view='architecture';const n=state.data.architecture.nodes.find(x=>x.id===id);state.selected=n?selectionForNode(n):null;state.query='';$('global-search').value='';render();}
function renderTop(){const b=$('refresh');b.disabled=state.busy;b.textContent=state.busy?'读取中…':'↻ 刷新';document.body.classList.toggle('focus',state.focus);document.body.classList.toggle('hide-inspector',state.hideInspector);const p=state.selected?.kind==='plugin'?state.selected.plugin:null;const t=$('toggle-plugin');t.disabled=!p||p.missing||!p.row||state.busy;t.textContent=p?(p.disabled?'启用插件':'停用插件'):'停用插件';t.title=p?'生成 cordis.patch.yml 预览，确认后才写入 (Del)':'先选中一个插件';}
function renderNav(){const d=state.data;const counts={steward:'',overview:'',designer:'',checks:d?.report?.checks?.length??'—',plugins:d?.plugins.length??'—',surfaces:d?.surfaces.length??'—',architecture:d?.architecture.nodes.length??'—',history:d?.history.length??'—'};$('nav').replaceChildren(...views.map(([id,label,icon])=>{const b=btn('',()=>setView(id),'nav-'+id,'nav-btn'+(state.view===id?' active':''));b.append(node('span',{text:icon}),node('span',{text:label}),node('span',{class:'count',text:String(counts[id])}));return b;}));}
function pageHead(title,desc){return node('div',{class:'page-head'},[node('div',{},[node('h1',{text:title}),node('p',{text:desc})])]);}
function panel(title,body){return node('section',{class:'panel'},[node('div',{class:'panel-head'},[node('h2',{text:title})]),body]);}
function table(headers,rows){const t=node('table',{class:'data-table'});t.append(node('thead',{},[node('tr',{},headers.map(h=>node('th',{},[typeof h==='object'?btn(h.label+(state.sort.key===h.key?(state.sort.dir===1?' ↑':' ↓'):''),()=>{state.sort={key:h.key,dir:state.sort.key===h.key?-state.sort.dir:1};persistView();render();},'sort-'+h.key,'th-sort'):h]))) ]));const tb=node('tbody');rows.forEach(r=>tb.append(r));t.append(tb);return t;}

  if(state.patchPreview){const p=state.patchPreview;const confirm=btn(p.disable?'确认停用并备份':'确认启用并备份',applyToggle,'confirm-toggle','btn'+(p.disable?' danger':''));confirm.disabled=p.before===p.after||state.busy;const dialog=node('div',{class:'patch-dialog','data-testid':'patch-dialog'});const card=node('section',{class:'patch-card'},[node('h2',{text:'生成 cordis.patch.yml'}),node('div',{class:'hint',text:p.plugin.name+' · '+(p.disable?'停用':'启用')+' · 预览不写文件；确认后保留备份，重启 mini 生效。'}),node('div',{class:'patch-diff'},[node('div',{},[node('strong',{text:'当前'}),node('pre',{'data-testid':'patch-before',text:p.before||'(空文件)'})]),node('div',{},[node('strong',{text:'生成结果'}),node('pre',{'data-testid':'patch-after',text:p.after})])]),node('div',{class:'patch-actions'},[btn('取消',()=>{state.patchPreview=null;renderOverlays();},'cancel-toggle'),confirm])]);dialog.append(card);document.body.append(dialog);}
}
function render(){renderTop();if(!state.data)return;renderNav();$('main').replaceChildren();({steward,overview,designer,checks,plugins,surfaces,architecture,history}[state.view]||overview)();renderInspector();renderOverlays();}
$('global-search').addEventListener('input',e=>{state.query=e.target.value.trim();persistView();render();});
$('refresh').addEventListener('click',load);
$('export').addEventListener('click',exportFiltered);
$('toggle-plugin').addEventListener('click',()=>previewToggle(state.selected?.plugin));
$('details').addEventListener('click',()=>{state.hideInspector=!state.hideInspector;renderTop();});
$('focus').addEventListener('click',()=>{state.focus=!state.focus;render();});
document.addEventListener('keydown',e=>{if(e.key==='F5'){e.preventDefault();load();}else if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('global-search').focus();}else if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();state.hideInspector=!state.hideInspector;renderTop();}else if(e.key==='Delete'&&state.selected?.plugin){e.preventDefault();previewToggle(state.selected.plugin);}else if(e.key==='Escape'){state.context=null;state.patchPreview=null;renderOverlays();}});
document.addEventListener('click',e=>{if(state.context&&!e.target.closest('.context-menu')){state.context=null;renderOverlays();}});
restoreView().then(load).catch(()=>load());
