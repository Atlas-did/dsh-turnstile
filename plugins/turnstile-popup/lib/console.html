ext-decoration:none;border:1px solid #72b7ff55;border-radius:7px;padding:8px 10px;margin-top:10px;word-break:break-all}.source-link:hover{background:#72b7ff10}.notice{padding:9px 12px;border:1px solid var(--amber);border-radius:8px;color:var(--amber);margin-bottom:12px;background:#e6b85c0a}.focus .workspace{grid-template-columns:0 minmax(0,1fr) 0}.focus .sidebar,.focus .inspector{display:none}.focus .main{padding-left:max(24px,calc((100vw - 1200px)/2));padding-right:max(24px,calc((100vw - 1200px)/2))}

body{font-family:"Segoe UI Variable","Segoe UI",ui-sans-serif,system-ui,sans-serif;letter-spacing:.005em}.topbar{background:#0e151d;box-shadow:0 1px 0 #0005}.brand{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.06em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid #82c7ff55;border-radius:8px;background:#82c7ff0d;color:var(--blue);font:700 11px var(--mono);letter-spacing:0}.brand small{letter-spacing:.12em}.search{transition:border-color .15s,box-shadow .15s;background:#0b1219}.btn,.icon-btn{transition:background .15s,border-color .15s,color .15s}.btn:active:not(:disabled),.icon-btn:active:not(:disabled){transform:translateY(1px)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.workspace{grid-template-columns:210px minmax(420px,1fr) 300px}.sidebar{padding:14px 10px;background:var(--nav)}#nav{display:flex;flex-direction:column;gap:2px}.nav-group-label{margin:15px 10px 5px;color:#718390;font-size:10px;font-weight:600;letter-spacing:.12em}.nav-group-label:first-child{margin-top:2px}.nav-btn{min-height:36px;padding:8px 10px;border-radius:6px;font-size:12px}.nav-btn.active{background:#82c7ff10;border-color:#82c7ff25;box-shadow:inset 2px 0 var(--blue)}.nav-btn .count:empty{display:none}.side-note{line-height:1.65}.main{padding:24px 26px 54px;background:radial-gradient(ellipse at 50% 0,#18304624,transparent 42%)}.page-head{margin-bottom:20px}.page-head h1{font-size:22px;font-weight:650;letter-spacing:-.02em}.page-head p{line-height:1.65}.panel{border-color:#2a3946;box-shadow:0 8px 24px #0000000d}.panel-head{background:#ffffff02}.metric{transition:border-color .15s,transform .15s,background .15s}.metric:hover{background:#182530}.history-row{display:grid;gap:3px;padding:10px 14px;border-bottom:1px solid #ffffff08}.history-row:last-child{border-bottom:0}.history-row strong{font-weight:600}.history-row small{display:block;color:var(--muted); <body>
<div class="app">
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">TS</span><span>TURNSTILE<small>PLUGIN WORKBENCH</small></span></div>
  <div class="search-wrap"><span class="search-icon">⌕</span><input id="global-search" data-testid="global-search" class="search" type="search" placeholder="即时筛选：插件、检查、UI 面、架构节点…" aria-label="全局筛选"></div>
  <div class="top-actions"><a class="btn" data-testid="new-page" href="/turnstile/builder" style="text-decoration:none;white-space:nowrap">＋ 新建页面</a><button id="export" data-testid="export-filtered" class="btn" type="button" title="导出当前筛选结果 CSV">导出</button><button id="refresh" data-testid="console-refresh" class="btn" type="button" title="重采样并比较变化 (F5)">↻ 刷新</button><button id="toggle-plugin" data-testid="toggle-plugin" class="btn danger" type="button" disabled>停用插件</button><button id="details" data-testid="details-toggle" class="icon-btn" type="button" title="显示/隐藏属性面板 (Ctrl+L)" aria-label="显示或隐藏属性面板">▤</button><button id="focus" data-testid="focus-mode" class="icon-btn" type="button" title="切换专注模式" aria-label="切换专注模式">⛶</button></div>
<button class="tier-toggle" id="toggle-nav" data-testid="toggle-nav" title="导航">导航</button><button class="tier-toggle" id="toggle-inspector" data-testid="toggle-inspector" title="检查器">检查器</button></header>
<div class="workspace">
<nav class="sidebar" aria-label="控制台导航"><div id="nav"></div><div class="side-note">清单声明 ≠ 运行态<br>缺少数据时明确显示，不猜测。</div></nav>
<main id="main" class="main" tabindex="-1"></main>
<aside id="inspector" class="inspector"></aside>
</div>
<footer class="statusbar"><span><i class="dot"></i><span id="connection">正在读取</span></span><span id="counts">0 / 0</span><span class="spacer"></span><span id="generated"></span></footer>
</div>

<script>
  function wireTierToggles(){var a=document.getElementById('toggle-nav'),b=document.getElementById('toggle-inspector');if(!a||!b)return;
    a.addEventListener('click',function(){var on=document.body.classList.toggle('tier-drawer-open');document.body.classList.remove('tier-sheet-open');a.setAttribute('aria-expanded',String(on));});
    b.addEventListener('click',function(){var on=document.body.classList.toggle('tier-sheet-open');document.body.classList.remove('tier-drawer-open');b.setAttribute('aria-expanded',String(on));});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')document.body.classList.remove('tier-drawer-open','tier-sheet-open');});}
  wireTierToggles();
'use strict';
const $=(id)=>document.getElementById(id);
const state={data:null,view:'overview',query:'',selected:null,inspectorTab:'properties',archId:'profile',pluginStatus:'all',busy:false,focus:false,hideInspector:false,delta:null,sort:{key:'name',dir:1},context:null,patchPreview:null,notice:'',skeleton:null};
const views=[['steward','环境管家','◎'],['overview','总览','⌂'],['designer','配置设计器','▧'],['checks','门禁检查','✓'],['plugins','插件','▤'],['surfaces','UI 占用','▦'],['architecture','深层架构','⌘'],['history','历史','◷'],['launcher','启动器','⌕'],['skeleton','插件检查','◫']];
function node(tag,props={},children=[]){const n=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined)n.setAttribute(k,v);}for(const c of children){if(c===null||c===undefined)continue;n.append(c.nodeType?c:document.createTextNode(String(c)));}return n;}
function btn(text,onClick,testid,cls='btn'){return node('button',{type:'button',class:cls,text,'data-testid':testid,onclick:onClick});}
function chip(text,kind=''){return node('span',{class:'chip '+kind,text});}
function matches(value){return !state.query||JSON.stringify(value).toLowerCase().includes(state.query.toLowerCase());}
function apiUrl(){return location.pathname.indexOf('/turnstile/console')===0?'/turnstile/console-data':'/api/console';}
function tokenSuffix(){const t=new URLSearchParams(location.search).get('token');return t?'?token='+encodeURIComponent(t):'';}
function snapshotOf(d){const out={};const positions={};(d.occupancy?.surfaces||[]).forEach(s=>Object.entries(s.anchors||{}).forEach(([name,anchor])=>{if(anchor)positions[name]=anchor;}));d.plugins.forEach(p=>{out[p.name]={state:p.missing?'missing':p.disabled?'off':'on',position:positions[p.name]||''};});return out;}
function deltaOf(current,previous){const delta={firstRun:!previous,at:previous?.at||null,added:[],removed:[],toggled:[],moved:[]};if(!previous?.rows)return delta;for(const [name,row] of Object.entries(current)){const old=previous.rows[name];if(!old)delta.added.push(name);else{if(old.state!==row.state)delta.toggled.push({name,from:old.state,to:row.state});if(old.position!==row.position)delta.moved.push({name,from:old.position||'未设置',to:row.position||'未设置'});}}for(const name of Object.keys(previous.rows))if(!current[name])delta.removed.push(name);return delta;}
function selectionForPlugin(p){return{title:p.name,kind:'plugin',plugin:p,properties:{名称:p.name,版本:p.version||'未安装',状态:p.missing?'未安装':p.disabled?'已停用':'配置启用',行ID:p.rows.join(', ')||'无',UI面:p.ui.join(', ')||'无',引擎范围:p.engineRange||'未声明'},source:{file:p.manifest,line:1},archId:p.architectureId};}
async function load(){state.busy=true;renderTop();try{const r=await fetch(apiUrl()+tokenSuffix(),{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);const next=await r.json();const key='turnstile.console.seen.'+next.profile.name;let previous=null;try{previous=JSON.parse(localStorage.getItem(key)||'null');}catch{}const rows=snapshotOf(next);state.delta=deltaOf(rows,previous);try{localStorage.setItem(key,JSON.stringify({at:new Date().toISOString(),rows}));}catch{}state.data=next;if(!next.architecture.nodes.some(n=>n.id===state.archId))state.archId=next.architecture.rootId;if(state.selected?.kind==='plugin'){const p=next.plugins.find(x=>x.name===state.selected.title);state.selected=p?selectionForPlugin(p):null;}else if(state.selected?.archId){const n=next.architecture.nodes.find(x=>x.id===state.selected.archId);state.selected=n?selectionForNode(n):null;}$('connection').textContent='数据已读取';document.body.dataset.health='ok';}catch(e){$('connection').textContent='读取失败：'+(e.message||e);document.body.dataset.health='failed';state.notice=String(e.message||e);$('counts').textContent='读取失败';}finally{state.busy=false;applyNavHash();render();syncNavHash();}}
async function toggleRequest(plugin,dryRun){const r=await fetch('/turnstile/toggle'+tokenSuffix(),{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({package:plugin.name,disable:!plugin.disabled,dryRun})});const d=await r.json();if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d;}

  const main=$('main');
  main.replaceChildren();
  main.append(pageHead('启动器','搜文件（索引在 state/launcher-index.json）。输入即搜，Enter 打开第一条。'));
  const box=node('section',{class:'panel'});
  const input=node('input',{placeholder:'搜文件名/路径…','data-testid':'launcher-input',style:'width:100%;padding:8px;border:1px solid #2b3a49;border-radius:6px;background:#0d141c;color:#dce3ea;font:inherit'});
  input.value=launcherState.q;
  let timer=null;
  input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>launcherSearch(input.value),180);});
  input.addEventListener('keydown',(e)=>{if(e.key==='Enter')launcherSearch(input.value);});
  box.append(node('div',{class:'panel-head'},[node('strong',{text:'搜索'})]),input);
  if(launcherState.error)box.append(node('p',{class:'hint','data-testid':'launcher-error',text:'搜索失败：'+launcherState.error}));
  const list=node('div',{'data-testid':'launcher-results'});
  for(const h of launcherState.hits.slice(0,30)){
    const row=node('div',{class:'history-row'});
    row.append(node('strong',{text:String(h.score).padStart(4)+'  '+h.name}));
    row.append(node('small',{text:h.path}));
    list.append(row);
  }
  if(launcherState.busy)list.append(node('p',{class:'hint',text:'正在搜索…'}));
  else if(launcherState.status==='no-index')list.append(node('p',{class:'hint','data-testid':'launcher-no-index',text:'尚未建立文件索引。请先运行 '+(launcherState.hint||'node tools/launcher.mjs index --root <目录>')+'，再回来搜索。'}));
  else if(!launcherState.hits.length&&!launcherState.error)list.append(node('p',{class:'hint',text:launcherState.q?'没有找到匹配的文件。':'输入关键词开始搜索'}));
  box.append(list);
  main.append(box);
}
function render(){renderTop();if(!state.data)return;renderNav();$('main').replaceChildren();({steward,overview,designer,checks,plugins,surfaces,architecture,history,launcher,skeleton}[state.view]||overview)();renderInspector();renderOverlays();}
$('global-search').addEventListener('input',e=>{state.query=e.target.value.trim();persistView();render();});
$('refresh').addEventListener('click',load);
$('export').addEventListener('click',exportFiltered);
$('toggle-plugin').addEventListener('click',()=>previewToggle(state.selected?.plugin));
$('details').addEventListener('click',()=>{state.hideInspector=!state.hideInspector;renderTop();});
$('focus').addEventListener('click',()=>{state.focus=!state.focus;render();});
// 定位框要有人初始化才会挂键盘监听（方案 01-A）
navPalette();
document.addEventListener('keydown',e=>{if(e.key==='F5'){e.preventDefault();load();}else if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('global-search').focus();}else if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();state.hideInspector=!state.hideInspector;renderTop();}else if(e.key==='Delete'&&state.selected?.plugin){e.preventDefault();previewToggle(state.selected.plugin);}else if(e.key==='Escape'){state.context=null;state.patchPreview=null;renderOverlays();}});
document.addEventListener('click',e=>{if(state.context&&!e.target.closest('.context-menu')){state.context=null;renderOverlays();}});
restoreView().then(load).catch(()=>load());
</script>
